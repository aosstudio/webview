name: Measure runner disk space

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/runner-disk.yml
      - scripts/measure-runner-disk.sh

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure filesystem capacity and preinstalled software
        shell: bash
        run: bash scripts/measure-runner-disk.sh | tee -a "$GITHUB_STEP_SUMMARY"
